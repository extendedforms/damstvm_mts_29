<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ZENITH HIGH CBT Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 420px;
      margin: 45px auto;
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      color: #0b2c66;
      margin-bottom: 5px;
      letter-spacing: 2px;
    }

    h2 {
      text-align: center;
      color: #333;
      font-size: 18px;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: #0b2c66;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #888;
    }

    .msg {
      text-align: center;
      margin-top: 16px;
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>ZENITH HIGH</h1>
    <h2>Mock Test Login</h2>

    <label>Candidate ID</label>
    <input type="text" id="candidateId" placeholder="Enter Candidate ID">

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter Password">

    <label>Name</label>
    <input type="text" id="name" placeholder="Enter Name">

    <label>Phone</label>
    <input type="tel" id="phone" placeholder="Enter Phone Number">

    <label>Email</label>
    <input type="email" id="email" placeholder="Enter Email">

    <button id="loginBtn" onclick="login()">Login</button>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPnoGBrcCqB1BWFKqCjScxzdM3s7FNNVJ4vz2i0FxI4cNPU52uJgJVzqif4D3O3YyQ/exec";

    async function login() {
      const candidateId = document.getElementById("candidateId").value.trim();
      const password = document.getElementById("password").value.trim();
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();

      const msg = document.getElementById("msg");
      const btn = document.getElementById("loginBtn");

      msg.textContent = "";

      if (!candidateId || !password || !name || !phone || !email) {
        msg.textContent = "Please fill all details";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Checking...";

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "login",
            candidateId: candidateId,
            password: password,
            name: name,
            phone: phone,
            email: email
          })
        });

        const result = await res.json();

        if (result.status === "success") {
          localStorage.setItem("candidateId", result.candidateId);
          localStorage.setItem("candidateName", result.name);
          localStorage.setItem("candidatePhone", result.phone);
          localStorage.setItem("candidateEmail", result.email);
          localStorage.setItem("token", result.token);

          window.location.href = "exam.html";
        } else {
          msg.textContent = result.message;
        }

      } catch (error) {
        msg.textContent = "Login failed. Please try again.";
      }

      btn.disabled = false;
      btn.textContent = "Login";
    }
  </script>
</body>
</html>
